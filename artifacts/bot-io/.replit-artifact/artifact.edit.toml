kind = "api"
previewPath = "/bot"
title = "Bot.io"
version = "1.0.0"
id = "bot-io-001"

[[services]]
localPort = 5000
name = "Bot.io Server"
paths = ["/bot"]

[services.development]
run = "pnpm --filter @workspace/bot-io run dev"

[services.production]

[services.production.run]
args = ["node", "artifacts/bot-io/server.js"]

[services.production.run.env]
PORT = "5000"
NODE_ENV = "production"
